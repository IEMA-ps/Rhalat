function renderPriceOptionsListMarkup(){
  if(!pendingPriceOptions.length) return `<div class="trip-meta">لسه معملتش خيارات سعر لهذه الرحلة.</div>`;
  const groups = {};
  const addons = [];
  pendingPriceOptions.forEach(o=>{
    if(o.group){ (groups[o.group]=groups[o.group]||[]).push(o); }
    else addons.push(o);
  });
  let html = '';
  const rowMarkup = (o)=>{
    const sign = o.delta>0?'+':'';
    return `<div class="row" style="align-items:center; margin-bottom:6px;">
      <div style="flex:3; font-size:13.5px;">${escapeHtml(o.label)} ${o.isDefault?'<span class="badge muted">افتراضي</span>':''} <span class="badge ${o.delta>0?'accent':o.delta<0?'approved':'muted'}">${sign}${o.delta||0} جنيه</span></div>
      <button type="button" class="btn danger" style="flex:0 0 auto; padding:6px 12px; font-size:12px;" onclick="removePriceOption('${o.id}')">حذف</button>
    </div>`;
  };
  Object.keys(groups).forEach(g=>{
    html += `<div class="trip-meta" style="font-weight:700; margin-bottom:2px;">مجموعة: ${escapeHtml(g)}</div>`;
    html += groups[g].map(rowMarkup).join('');
  });
  if(addons.length){
    html += `<div class="trip-meta" style="font-weight:700; margin-bottom:2px;">خدمات إضافية</div>`;
    html += addons.map(rowMarkup).join('');
  }
  return html;
}

function refreshPriceOptionsListUI(){
  const holder = document.getElementById('priceOptionsListHolder');
  if(holder) holder.innerHTML = renderPriceOptionsListMarkup();
}

function addPriceOption(){
  const labelEl = document.getElementById('npoLabel');
  const groupEl = document.getElementById('npoGroup');
  const deltaEl = document.getElementById('npoDelta');
  const defaultEl = document.getElementById('npoDefault');
  const label = labelEl.value.trim();
  const group = groupEl.value.trim();
  const delta = parseFloat(deltaEl.value);
  const isDefault = defaultEl.checked;
  if(!label){ toast('اكتب اسم الخيار الأول', 'error'); return; }
  if(isNaN(delta)){ toast('اكتب قيمة صحيحة للتأثير على السعر (ممكن تكون سالبة)', 'error'); return; }
  const id = 'po_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  if(group && isDefault){
    pendingPriceOptions.forEach(o=>{ if(o.group===group) o.isDefault=false; });
  }
  pendingPriceOptions.push({id, label, group: group||null, delta, isDefault: group ? isDefault : false});
  labelEl.value=''; groupEl.value=''; deltaEl.value=''; defaultEl.checked=false;
  refreshPriceOptionsListUI();
}

function removePriceOption(id){
  pendingPriceOptions = pendingPriceOptions.filter(o=>o.id!==id);
  refreshPriceOptionsListUI();
}

function updateEditCityOptions(preselect){
  const govSel = document.getElementById('eGovernorate');

  const gov = govSel.value;
  const prevValue = preselect || citySel.value;

  if(newCityField) newCityField.classList.add('hidden');
  if(!gov){
    citySel.innerHTML = `<option value="">اختار المحافظة الأول</option>`;
    return;
  }
  const cities = citiesCache.filter(c=>c.governorate===gov).sort((a,b)=>a.name.localeCompare(b.name,'ar'));

async function saveEditTrip(tripId){
  const t = tripsCache.find(x=>x.id===tripId);
  if(!t) return;
  const destination = document.getElementById('eDest').value.trim();
  const governorate = document.getElementById('eGovernorate').value;
  const citySel = document.getElementById('eCity');
  let city = citySel.value;
  const date = document.getElementById('eDate').value;
  const price = parseFloat(document.getElementById('ePrice').value);
  const busType = document.getElementById('eBusType').value;
  const seatsTotal = parseInt(busType);
  const meetingPoint = document.getElementById('eMeetPoint').value.trim();
  const meetingTime = document.getElementById('eMeetTime').value;
  const departureTime = document.getElementById('eDepTime').value;
  const locationUrl = document.getElementById('eLocation').value.trim();
  const notes = document.getElementById('eNotes').value.trim();
  const imageUrl = pendingTripImageUrl || t.imageUrl || '';

  if(!destination || !date || isNaN(price) || price < 0 || !seatsTotal){
    toast('من فضلك املأ كل الحقول المطلوبة بقيم صحيحة', 'error'); return;
  }
  if(!governorate || !city){
    toast('من فضلك حدد محافظة ومدينة الرحلة', 'error'); return;
  }
  if(city === '__new__'){
    const newCity = document.getElementById('eNewCity').value.trim();
    if(!newCity){ toast('من فضلك اكتب اسم المدينة الجديدة', 'error'); return; }
    city = newCity;
  }
  const maxBookedSeat = (t.bookedSeats && t.bookedSeats.length) ? Math.max(...t.bookedSeats) : 0;
  if(seatsTotal < maxBookedSeat){
    toast(`مينفعش تقلل حجم الباص كده — فيه حجز على مقعد رقم ${maxBookedSeat}. لازم تلغي الحجوزات المتأثرة الأول أو تختار باص أكبر.`, 'error');
    return;
  }
  try{
    await ensureCityExists(governorate, city);
    await db.collection('trips').doc(tripId).update({
      destination, governorate, city, date, price, seatsTotal, busType, meetingPoint, meetingTime, departureTime,
      locationUrl, notes, imageUrl, priceOptions: pendingPriceOptions
    });
    toast('تم حفظ التعديلات', 'success');
    pendingTripImageUrl = '';
    renderAdmin();
  }catch(e){ toast('حدث خطأ أثناء الحفظ', 'error'); }
}

async function markPayment(bookingId){

  const amount = prompt(`المبلغ المدفوع من إجمالي ${b.amount} جنيه:`, b.amountPaid||0);
  if(amount===null) return;
  let paid = parseFloat(amount);
  if(isNaN(paid) || paid < 0){ toast('قيمة غير صحيحة', 'error'); return; }
  const status = paid>=b.amount ? 'paid' : paid>0 ? 'partial' : 'unpaid';
  await db.collection('bookings').doc(bookingId).update({amountPaid:paid, paymentStatus:status});
  toast('تم تحديث حالة الدفع', 'success');
  // أول ما الدفع يتأكد لأول مرة، ابعت التذكرة (رابط + QR) للعميل على واتساب تلقائيًا
  if(wasUnpaid && status !== 'unpaid'){
    sendTicketWhatsApp(bookingId);
  }
}

async function approveWalletRequest(reqId){
  const req = walletRequestsCache.find(r=>r.id===reqId);
  if(!req) return;
  if(!confirm(`تأكيد إضافة ${req.amount} جنيه لرصيد ${req.userName||'المستخدم'}؟`)) return;
  try{
    await db.runTransaction(async (tx)=>{
      const reqRef = db.collection('walletRequests').doc(reqId);
      const reqDoc = await tx.get(reqRef);
      if(!reqDoc.exists || reqDoc.data().status !== 'pending') throw new Error('already-handled');
      const userRef = db.collection('users').doc(req.uid);
      const userDoc = await tx.get(userRef);
      const currentBalance = userDoc.exists ? (userDoc.data().balance||0) : 0;
      tx.update(userRef, {balance: currentBalance + req.amount});
      tx.update(reqRef, {status:'approved', reviewedAt: Date.now()});
    });
    toast('تم شحن الرصيد للمستخدم', 'success');
  }catch(e){ toast(e.message==='already-handled' ? 'الطلب اتراجع بالفعل' : 'تعذر تنفيذ الشحن', 'error'); }
}

async function rejectWalletRequest(reqId){
  if(!confirm('تأكيد رفض طلب الشحن؟')) return;

    toast('تم رفض الطلب', 'success');

}

async function payBookingFromWallet(bookingId){
  if(!confirm('تأكيد الدفع من رصيدك؟')) return;
  try{
    await db.runTransaction(async (tx)=>{
      const bookingRef = db.collection('bookings').doc(bookingId);
      const userRef = db.collection('users').doc(currentUser.uid);
      const [bookingDoc, userDoc] = await Promise.all([tx.get(bookingRef), tx.get(userRef)]);
      if(!bookingDoc.exists) throw new Error('booking-not-found');
      const b = bookingDoc.data();
      if(b.participantUid !== currentUser.uid) throw new Error('not-yours');
      if(b.cancelled) throw new Error('cancelled');
      const remaining = Math.max((b.amount||0) - (b.amountPaid||0), 0);
      if(remaining <= 0) throw new Error('already-paid');
      const balance = userDoc.exists ? (userDoc.data().balance||0) : 0;
      if(balance < remaining) throw new Error('insufficient');
      tx.update(userRef, {balance: balance - remaining});
      tx.update(bookingRef, {amountPaid:(b.amountPaid||0)+remaining, paymentStatus:'paid'});
    });
    toast('تم الدفع من رصيدك بنجاح ✅', 'success');
    sendTicketWhatsApp(bookingId);
  }catch(e){
    if(e.message==='insufficient') toast('رصيدك مش كفاية لدفع المبلغ المطلوب', 'error');
    else if(e.message==='already-paid') toast('الحجز مدفوع بالفعل', 'error');
    else toast('تعذر تنفيذ الدفع من الرصيد', 'error');
  }
}

async function payAllCommissions(uid){

  const total = dueBookings.reduce((s,b)=>s+(b.commissionAmount||0),0);

async function showTicketLookup(bookingId, localOverride){
  ticketViewActive = true;
  const app = document.getElementById('app');
  app.innerHTML = `<div class="card">جاري تحميل بيانات التذكرة...</div>`;
  try{
    // لو مفيش نت، اقرأ من الكاش المحلي على طول من غير ما تستنى محاولة الاتصال بالسيرفر
    const doc = await db.collection('bookings').doc(bookingId).get(
      navigator.onLine ? {} : {source:'cache'}
    );
    if(!doc.exists){
      app.innerHTML = `<div class="card">التذكرة دي مش موجودة${!navigator.onLine ? ' في الكاش المحلي — التذكرة دي لسه ما اتحمّلتش أوفلاين، لازم تفتحها مرة وانت متصل بالنت' : ''}.</div>`;
      return;
    }
    const b = {id:doc.id, ...doc.data(), ...(localOverride||{})};
    const offlineBadge = doc.metadata.fromCache ? `<span class="badge muted">📴 بيانات من الكاش (من غير نت)</span>` : '';
    app.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">مسح تذكرة ${offlineBadge}</h3>
        <div class="trip-title">${escapeHtml(b.tripDestination)} ${b.cancelled?'<span class="badge rejected">ملغي</span>':''}</div>
        <div class="trip-meta">
          الاسم: <b>${escapeHtml(b.participantName)}</b><br>
          الموبايل: <b>${escapeHtml(b.participantPhone||'')}</b><br>
          عدد المقاعد: <b>${b.seats}</b>${b.seatNumbers && b.seatNumbers.length ? ` (${b.seatNumbers.join('، ')})` : ''}<br>
          حالة الدفع: <span class="badge ${b.paymentStatus}">${b.paymentStatus==='paid'?'مدفوع':b.paymentStatus==='partial'?'جزئي':'غير مدفوع'}</span>
        </div>
        ${b.attended
          ? `<div class="badge approved" style="display:inline-block; margin-top:10px;">✅ الحضور مسجّل بالفعل</div>`
          : (b.cancelled ? '' : `<button class="btn block" onclick="markAttendance('${b.id}')">✅ تسجيل الحضور الآن</button>`)}
        <button class="btn secondary block" onclick="ticketViewActive=false; if(currentUserData.role==='admin'){currentTab='admin'; adminSubTab='bookings'; renderAdmin();} else {currentTab='mine'; renderMine();}">رجوع</button>
      </div>`;
  }catch(e){
    app.innerHTML = `<div class="card">حصل خطأ أثناء تحميل التذكرة${!navigator.onLine ? ' — التذكرة دي لسه ما اتحمّلتش للكاش المحلي' : ''}: ${escapeHtml(e.message||'')}</div>`;
  }
}

async function markAttendance(bookingId){
  const wasOnline = navigator.onLine;
  // مبنستناش الـ promise عشان مايعلقش الشاشة لو أوفلاين — بيتسجل محليًا فورًا ويتزامن تلقائيًا مع السيرفر لما النت يرجع
  db.collection('bookings').doc(bookingId).update({attended:true, attendedAt: Date.now()})
    .then(()=>{ if(!wasOnline) toast('تم مزامنة الحضور مع السيرفر ✅', 'success'); })
    .catch(e=>{ console.error('markAttendance error:', e); toast('تعذر حفظ الحضور: ' + (e.code || e.message || ''), 'error'); });
  toast(wasOnline ? 'تم تسجيل الحضور ✅' : 'اتسجل الحضور محليًا 📴 هيتزامن أول ما النت يرجع', 'success');
  showTicketLookup(bookingId, {attended:true, attendedAt: Date.now()});
}

// ---------------- فتح باص جديد عند اكتمال الباص الأساسي ----------------
async function openNewBus(tripId){
  const parent = tripsCache.find(x=>x.id===tripId);
  if(!parent) return;
  // لو فيه باص إضافي مفتوح بالفعل لنفس الرحلة ولسه فيه مقاعد فاضية، ادخل عليه على طول
  const existingOverflow = tripsCache.find(x=>
    x.parentTripId===tripId && x.status==='approved' &&
    ((x.seatsTotal||0) - (x.seatsBooked||0)) > 0
  );
  if(existingOverflow){ openBooking(existingOverflow.id); return; }
  try{
    const newTripData = {
      destination: parent.destination, governorate: parent.governorate||'', city: parent.city||'',
      date: parent.date, price: parent.price, seatsTotal: parent.seatsTotal, busType: parent.busType||null,
      meetingPoint: parent.meetingPoint||'', meetingTime: parent.meetingTime||'', departureTime: parent.departureTime||'',
      notes: parent.notes||'', imageUrl: parent.imageUrl||'', locationUrl: parent.locationUrl||'',
      status:'approved', proposedBy: parent.proposedBy||null, proposedByName: parent.proposedByName||null,
      commissionType: parent.commissionType||null, commissionValue: parent.commissionValue||0,
      seatsBooked:0, bookedSeats:[], hidden:false,
      parentTripId: tripId, isOverflowBus:true, createdAt: Date.now()
    };
    const ref = await db.collection('trips').add(newTripData);
    // نضيفه فورًا للكاش المحلي عشان شاشة الحجز تلاقيه على طول من غير ما تستنى تحديث اللايف داتا
    tripsCache = [{id: ref.id, ...newTripData}, ...tripsCache];
    toast('اتفتح باص جديد للرحلة دي 🚌، احجز مكانك دلوقتي', 'success');
    openBooking(ref.id);
  }catch(e){ toast('تعذر فتح باص جديد، حاول تاني', 'error'); }
}

// ---------------- تقييم الرحلة ----------------
function starRateMarkup(tripId, current){
  let html = `<div class="star-rate" id="starRate_${tripId}">`;
  for(let i=1;i<=5;i++){
    html += `<span data-v="${i}" class="${i<=current?'filled':''}" onclick="setTripRatingValue('${tripId}',${i})">★</span>`;
  }
  html += `</div>`;
  return html;
}

let pendingRatingValue = {};

function setTripRatingValue(tripId, val){
  pendingRatingValue[tripId] = val;
  const holder = document.getElementById(`starRate_${tripId}`);
  if(holder){
    [...holder.children].forEach((s,i)=> s.classList.toggle('filled', i < val));
  }
}

async function submitTripRating(tripId){
  const val = pendingRatingValue[tripId];
  if(!val){ toast('اختار عدد النجوم الأول', 'error'); return; }
  const commentEl = document.getElementById(`ratingComment_${tripId}`);
  const comment = commentEl ? commentEl.value.trim() : '';
  try{
    await db.collection('tripRatings').doc(`${tripId}_${currentUser.uid}`).set({
      tripId, uid: currentUser.uid, name: currentUserData.name||'',
      rating: val, comment, createdAt: Date.now()
    });
    toast('شكرًا لتقييمك 🌟', 'success');
    renderMine();
  }catch(e){ toast('تعذر حفظ التقييم', 'error'); }
}

function tripAvgRating(tripId){
  const rs = ratingsCache.filter(r=>r.tripId===tripId);
  if(rs.length===0) return null;
  const avg = rs.reduce((s,r)=>s+r.rating,0) / rs.length;
  return {avg: Math.round(avg*10)/10, count: rs.length};
}



// ---------------- رسالة تأكيد الحجز عبر واتساب ----------------
function buildWhatsAppLink(phone, message){
  let clean = (phone||'').replace(/\D/g,'');
  if(clean.startsWith('0')) clean = '20' + clean.slice(1);
  else if(!clean.startsWith('20')) clean = '20' + clean;
  return `https://wa.me/${clean}?text=${encodeURIComponent(message)}`;
}

// بيفتح رابط واتساب بتنقّل مباشر في نفس الصفحة (زي ضغطة على لينك عادي)
// بدل ما يفتح تبويب جديد. أندرويد بيعرض شاشة تأكيد "هل تريد المتابعة؟" تحديدًا
// لما الرابط بيتفتح في سياق تبويب/نافذة جديدة، فالتنقل المباشر بيتجنب المشكلة دي.

function sendBookingMessage(bookingId){
  const b = bookingsCache.find(x=>x.id===bookingId);

  let msg = siteSettings.bookingMessageTemplate || '';

    .replaceAll('{الاسم}', b.participantName||'')

    .replaceAll('{المبلغ}', b.amount||'');
  openWhatsAppLink(buildWhatsAppLink(b.participantPhone, msg));
}

function downloadExcel(rows, sheetName, filename){
  if(!rows.length){ toast('لا توجد بيانات كافية لعمل التقرير', 'error'); return; }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename);
  }catch(e){ toast('تعذر إنشاء ملف الإكسل', 'error'); }
}
