<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الرحلات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D6E63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
  :root{
    --ink:#1E2A2A; --muted:#75817C; --bg:#F5F1E6; --surface:#FFFFFF; --border:#E6DFCC;
    --primary:#0D6E63; --primary-dark:#083F38; --primary-light:#E1EFEC;
    --accent:#DD8A3E; --accent-dark:#A9611F; --accent-light:#FBEEDD;
    --danger:#BE4438; --danger-light:#F7E2DE;
    --success:#2E8858; --success-light:#DEEFE4;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--ink);
    margin:0; padding-bottom:74px; min-height:100vh;
  }
  h1,h2,h3,.trip-title,.btn,label,.tab{font-family:'Cairo',sans-serif;}
  h3{ font-weight:800; color:var(--ink); position:relative; padding-bottom:12px; margin:0 0 4px;}
  h3::after{
    content:""; display:block; position:absolute; right:0; bottom:2px;
    width:44px; height:0; border-top:3px dashed var(--accent);
  }
  header{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff; padding:16px 18px; position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 10px rgba(8,63,56,.25);
  }
  header h1{font-size:18px; margin:0; font-weight:800; display:flex; align-items:center;}
  header .user-badge{font-size:12px; opacity:.92;}
  .container{max-width:640px; margin:0 auto; padding:16px;}
  .card{
    background:var(--surface); border-radius:16px; padding:16px; margin-bottom:14px;
    box-shadow:0 2px 10px rgba(30,42,42,.06); border:1px solid var(--border);
  }
  .btn{
    display:inline-block; background:var(--primary); color:#fff; border:none;
    padding:12px 18px; border-radius:12px; font-family:inherit; font-weight:700;
    font-size:14px; cursor:pointer; text-align:center; transition:.15s;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
  .btn.danger{background:var(--danger);}
  .btn.accent{background:var(--accent); color:#fff;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  input, select, textarea{
    width:100%; padding:11px; border:1.5px solid var(--border); border-radius:10px;
    font-family:inherit; font-size:14px; margin-bottom:10px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
  label{font-size:13px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .tabbar{
    position:fixed; bottom:0; right:0; left:0; background:#fff; display:flex;
    border-top:1px solid var(--border); z-index:50; box-shadow:0 -2px 10px rgba(30,42,42,.08);
  }
  .tab{
    flex:1; text-align:center; padding:10px 4px 8px; font-size:11px; color:var(--muted);
    cursor:pointer; border:none; background:none; font-weight:700;
  }
  .tab.active{color:var(--primary);}
  .tab .icon{font-size:19px; display:block; margin-bottom:2px;}
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .badge.pending{background:var(--accent-light); color:var(--accent-dark);}
  .badge.approved{background:var(--success-light); color:var(--success);}
  .badge.rejected{background:var(--danger-light); color:var(--danger);}
  .badge.paid{background:var(--success-light); color:var(--success);}
  .badge.unpaid{background:var(--danger-light); color:var(--danger);}
  .badge.partial{background:var(--accent-light); color:var(--accent-dark);}
  .badge.muted{background:#EEEAE0; color:var(--muted);}
  .badge.accent{background:var(--accent-light); color:var(--accent-dark);}
  .offline-bar{position:sticky; top:0; z-index:60; background:var(--danger); color:#fff; text-align:center; font-size:12.5px; padding:8px 10px; font-weight:700;}
  .star-rate{display:flex; gap:4px; font-size:26px; cursor:pointer; user-select:none;}
  .star-rate span{color:#DDD6C4; transition:color .15s;}
  .star-rate span.filled{color:var(--accent);}
  .trip-title{font-size:16px; font-weight:800; margin:0 0 4px; color:var(--ink);}
  .trip-meta{font-size:13px; color:var(--muted); margin-bottom:8px; line-height:1.8;}
  .trip-meta b{color:var(--ink);}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:120px;}
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px;}
  .toast{
    position:fixed; top:70px; right:16px; left:16px; max-width:600px; margin:0 auto;
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:10px; font-size:13px;
    z-index:100; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .toast.error{background:var(--danger);}
  .toast.success{background:var(--success);}
  .hidden{display:none !important;}
  .divider{border:none; border-top:1px dashed var(--border); margin:14px 0;}
  .link-box{
    background:var(--primary-light); border:1px dashed var(--primary); border-radius:10px; padding:10px;
    font-size:12px; word-break:break-all; color:var(--primary-dark); margin-bottom:8px;
  }
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;}
  .stat .num{font-size:22px; font-weight:800; color:var(--primary); font-family:'Cairo',sans-serif;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .loading{text-align:center; padding:40px; color:var(--muted);}
  .auth-box{max-width:400px; margin:20px auto 0;}
  .auth-box h2{text-align:center; font-weight:800;}
  .switch-link{text-align:center; font-size:13px; color:var(--primary); cursor:pointer; margin-top:8px; font-weight:700;}
  .commission-form{background:var(--accent-light); border:1px solid #F0D5AE; border-radius:10px; padding:10px; margin-top:8px;}
  .header-logo{height:28px; width:28px; object-fit:cover; border-radius:6px; vertical-align:middle; margin-left:6px;}
  .landing-hero{
    text-align:center; padding:34px 16px 28px; margin:-16px -16px 18px;
    background:
      radial-gradient(circle at 18% 18%, rgba(13,110,99,.10), transparent 55%),
      radial-gradient(circle at 85% 12%, rgba(221,138,62,.14), transparent 45%);
    border-bottom:1px dashed var(--border);
  }
  .landing-logo-wrap{
    width:104px; height:104px; margin:0 auto 16px; border-radius:26px;
    background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 22px rgba(13,110,99,.18); border:1px solid var(--border);
  }
  .landing-logo{height:78px; width:78px; object-fit:contain; border-radius:16px;}
  .landing-hero h2{margin:0 0 12px; font-size:24px; font-weight:800; position:relative; display:inline-block;}
  .landing-hero h2::after{
    content:""; display:block; margin:10px auto 0; width:64px; height:0;
    border-top:3px dashed var(--accent);
  }
  .landing-hero p{color:var(--muted); font-size:14px; margin:0 auto; line-height:1.8; max-width:360px;}
  .trip-img{width:100%; height:160px; object-fit:cover; border-radius:12px; margin-bottom:10px; display:block; background:var(--primary-light);}
  .trip-img-wrap{position:relative; margin-bottom:10px;}
  .trip-img-wrap .trip-img{margin-bottom:0;}
  .price-badge{
    position:absolute; top:10px; left:10px; background:rgba(8,63,56,.88); color:#fff;
    padding:5px 13px; border-radius:999px; font-size:12px; font-weight:800; font-family:'Cairo',sans-serif;
  }
  .seats-pill{
    position:absolute; bottom:10px; right:10px; background:rgba(255,255,255,.94); color:var(--ink);
    padding:4px 11px; border-radius:999px; font-size:11px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .rating-badge{
    position:absolute; top:10px; right:10px; background:rgba(255,255,255,.95); color:var(--ink);
    padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,.12);
    display:flex; align-items:center; gap:3px; font-family:'Cairo',sans-serif;
  }
  .rating-badge .star{color:var(--accent);}
  .hero-banner{
    position:relative; height:180px; border-radius:18px; overflow:hidden; margin-bottom:16px;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary)) center/cover;
    display:flex; align-items:flex-end; box-shadow:0 6px 18px rgba(8,63,56,.2);
  }
  .hero-banner img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.75;}
  .hero-banner::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(8,63,56,.85) 0%, rgba(8,63,56,.15) 65%, rgba(8,63,56,0) 100%);
  }
  .hero-banner .hero-text{position:relative; z-index:1; color:#fff; padding:18px; width:100%;}
  .hero-banner .hero-eyebrow{font-size:12px; font-weight:700; opacity:.85; margin-bottom:4px; font-family:'Cairo',sans-serif;}
  .hero-banner .hero-title{font-size:21px; font-weight:800; font-family:'Cairo',sans-serif;}
  .search-bar-wrap{
    display:flex; align-items:center; background:#fff; border-radius:999px; padding:4px 6px 4px 16px;
    box-shadow:0 2px 10px rgba(30,42,42,.08); border:1px solid var(--border); margin-bottom:14px;
  }
  .search-bar-wrap input{
    flex:1; border:none; margin:0; padding:8px 4px; background:transparent; font-size:14px;
  }
  .search-bar-wrap input:focus{outline:none;}
  .search-bar-wrap .search-icon-btn{
    width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px;
  }
  .filter-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .map-link{color:var(--primary); font-weight:700; text-decoration:none; font-size:13px;}
  .admin-subnav{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:4px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .admin-subnav::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto; padding:9px 16px; border-radius:999px; border:1.5px solid var(--border);
    background:#fff; color:var(--muted); font-family:'Cairo',sans-serif; font-weight:700; font-size:13px;
    white-space:nowrap; cursor:pointer;
  }
  .pill.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .seat-map{display:flex; flex-direction:column; align-items:center; gap:8px; margin:10px 0; background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px 10px;}
  .seat-map-header{width:100%; text-align:center; font-size:13px; color:var(--ink); margin-bottom:6px; line-height:1.9;}
  .seat-map-header b{color:var(--primary-dark);}
  .seat-driver-row{width:100%; display:flex; direction:ltr; justify-content:flex-start; padding:0 6px; margin-bottom:10px; box-sizing:border-box;}
  .seat-driver{width:44px; height:44px; border-radius:10px; background:var(--primary-light); border:1.5px solid var(--primary); display:flex; align-items:center; justify-content:center; font-size:20px;}
  .seat-row{display:flex; direction:ltr; gap:7px; justify-content:center;}
  .aisle-gap{width:22px;}
  .seat, .seat-blank{
    width:40px; height:40px; border-radius:9px;
  }
  .seat-blank{visibility:hidden;}
  .seat{
    border:1.5px solid var(--border);
    font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; cursor:pointer; background:#fff; color:var(--ink);
  }
  .seat.available{background:#fff; color:var(--ink); border-color:var(--border);}
  .seat.selected{background:var(--primary); color:#fff; border-color:var(--primary);}
  .seat.taken{background:var(--primary-light); color:var(--muted); border-color:var(--primary-light); cursor:not-allowed;}
  .seat-legend{display:flex; gap:16px; justify-content:center; font-size:12px; color:var(--muted); margin:8px 0;}
  .seat-legend .dot{display:inline-block; width:14px; height:14px; border-radius:5px; margin-left:5px; vertical-align:middle;}
  .seat-legend .dot.selected{background:var(--primary); border:1px solid var(--primary);}
  .seat-legend .dot.taken{background:var(--primary-light); border:1px solid var(--border);}
  .seat-legend .dot.available{background:#fff; border:1px solid var(--border);}

  /* ---- زرار الدعم الفني والشات ---- */
  .support-fab{
    position:fixed; left:16px; bottom:90px; z-index:70;
    width:54px; height:54px; border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#fff;
    font-size:24px; cursor:pointer; box-shadow:0 6px 16px rgba(169,97,31,.35);
    display:flex; align-items:center; justify-content:center;
  }
  .support-fab .dot-alert{
    position:absolute; top:-2px; left:-2px; width:12px; height:12px; border-radius:50%;
    background:var(--danger); border:2px solid #fff;
  }
  .support-overlay{
    position:fixed; inset:0; background:rgba(30,42,42,.45); z-index:90;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .support-modal{
    background:var(--surface); width:100%; max-width:480px; height:min(78vh,640px);
    border-radius:20px 20px 0 0; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 -8px 26px rgba(0,0,0,.25);
  }
  .support-head{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary)); color:#fff;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .support-head b{font-family:'Cairo',sans-serif; font-size:15px;}
  .support-head .support-sub{font-size:11.5px; opacity:.85;}
  .support-close{background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1;}
  .support-body{flex:1; overflow-y:auto; padding:14px; background:var(--bg);}
  .support-msg{max-width:82%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.7; margin-bottom:10px; white-space:pre-wrap;}
  .support-msg.bot{background:#fff; border:1px solid var(--border); border-bottom-right-radius:4px; margin-left:auto;}
  .support-msg.me{background:var(--primary); color:#fff; border-bottom-left-radius:4px; margin-right:auto;}
  .support-foot{display:flex; gap:8px; padding:10px; border-top:1px solid var(--border); background:#fff;}
  .support-foot input{margin:0; flex:1;}
  .support-foot button{flex-shrink:0; padding:11px 16px;}
  .faq-item{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;}
</style>
</head>
<body>

<header>
  <h1 id="siteTitle">🧳 نظام الرحلات</h1>
  <div id="userBadge" class="user-badge hidden">
    <span id="userNameLbl"></span> · <a id="logoutBtn" style="color:#fff; cursor:pointer; text-decoration:underline;">خروج</a>
  </div>
</header>

<div id="offlineBar" class="offline-bar hidden">📴 مفيش نت دلوقتي — أي تسجيل حضور هيتحفظ محليًا ويتزامن أول ما النت يرجع</div>

<div id="toastHolder"></div>

<!-- زرار الدعم الفني — ظاهر في كل صفحات السيستم -->
<button class="support-fab" id="supportFab" onclick="openSupportChat()" title="الدعم الفني">💬</button>
<div class="support-overlay hidden" id="supportOverlay" onclick="if(event.target===this) closeSupportChat()">
  <div class="support-modal">
    <div class="support-head">
      <div>
        <b>💬 الدعم الفني</b><br>
        <span class="support-sub">اسأل وهنحاول نرد فورًا</span>
      </div>
      <button class="support-close" onclick="closeSupportChat()">✕</button>
    </div>
    <div class="support-body" id="supportBody"></div>
    <div class="support-foot">
      <input id="supportInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter'){event.preventDefault(); sendSupportMessage();}">
      <button class="btn" onclick="sendSupportMessage()">إرسال</button>
    </div>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">جاري التحميل...</div>
</div>

<div class="tabbar hidden" id="tabbar">
  <button class="tab" data-tab="trips"><span class="icon">🗺️</span>الرحلات</button>
  <button class="tab hidden" id="proposeTabBtn" data-tab="propose"><span class="icon">➕</span>اقترح رحلة</button>
  <button class="tab hidden" id="organizerTabBtn" data-tab="organizer"><span class="icon">🎓</span>مشرف رحلات</button>
  <button class="tab" id="mineTabBtn" data-tab="mine"><span class="icon">💰</span>رحلاتي وأرباحي</button>
  <button class="tab hidden" id="contactsTabBtn" data-tab="contacts"><span class="icon">📇</span>جهات الاتصال</button>
  <button class="tab hidden" id="adminTabBtn" data-tab="admin"><span class="icon">⚙️</span>الأدمن</button>
</div>

<script>
// تسجيل Service Worker عشان "شكل" التطبيق (الصفحة نفسها) يفتح حتى لو مفيش نت خالص —
// البيانات (الرحلات/الحجوزات/التذاكر) بتتخزن جوه Firestore نفسها (enablePersistence تحت)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.warn('تعذر تسجيل Service Worker (offline shell):', err);
    });
  });
}
</script>

<script>

   من Firebase Console > Project Settings > Your apps
   ========================================================= */

db.enablePersistence({synchronizeTabs:true}).catch(err=>{
  console.warn('Firestore offline persistence not enabled:', err.code);
});

// إعدادات Cloudinary (لرفع الصور مجانًا بدون ترقية Firebase لباقة مدفوعة)
const CLOUDINARY_CLOUD_NAME = "hglkbvu5";
const CLOUDINARY_UPLOAD_PRESET = "hommfb4n";

// ضع هنا إيميلات الأدمن (بالإضافة إلى role:"admin" في Firestore)
const ADMIN_EMAILS = ["iemasam89@gmail.com"];

let currentUser = null;
let currentUserData = null;
let currentTab = "trips";
let tripsCache = [];
let bookingsCache = [];
let refParam = null;
let unsubTrips = null;
let unsubBookings = null;

let organizerRequestsCache = [];
let allUsersCache = [];

let contactsCache = [];
let unsubContacts = null;
let authMode = 'login';
let adminSubTab = 'overview';
let pendingTripImageUrl = '';
let pendingLogoUrl = null; // null = مفيش تغيير، نص = رابط شعار جديد اترفع
let pendingHeroImageUrl = null; // null = مفيش تغيير، نص فاضي = اتلغت، نص = رابط صورة جديدة
let pendingIdFrontUrl = '';
let pendingIdBackUrl = '';
let pendingSelfieUrl = '';
const PHONE_RE = /^01[0125][0-9]{8}$/;

// محافظات مصر — قائمة ثابتة تظهر في التسجيل واختيار المدن بالأدمن

function uploadImageFile(file, folder, statusElId, previewElId){
  const statusEl = document.getElementById(statusElId);
  const previewEl = document.getElementById(previewElId);
  if(!file.type.startsWith('image/')){ toast('الملف لازم يكون صورة', 'error'); return Promise.resolve(null); }
  if(file.size > 5*1024*1024){ toast('حجم الصورة أكبر من 5 ميجا', 'error'); return Promise.resolve(null); }
  if(statusEl) statusEl.textContent = 'جاري رفع الصورة... 0%';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', folder);

  return new Promise((resolve)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`);
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable && statusEl){
        const pct = Math.round((e.loaded/e.total)*100);
        statusEl.textContent = `جاري رفع الصورة... ${pct}%`;
      }
    };
    xhr.onload = ()=>{
      let res = null;
      try{ res = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status>=200 && xhr.status<300 && res && res.secure_url){
        if(statusEl) statusEl.textContent = 'تم رفع الصورة ✅';
        if(previewEl){ previewEl.src = res.secure_url; previewEl.classList.remove('hidden'); }
        resolve(res.secure_url);
      } else {
        if(statusEl) statusEl.textContent = '';
        toast('تعذر رفع الصورة، حاول تاني', 'error');
        resolve(null);
      }
    };
    xhr.onerror = ()=>{
      if(statusEl) statusEl.textContent = '';
      toast('تعذر رفع الصورة، تأكد من الاتصال بالإنترنت', 'error');
      resolve(null);
    };
    xhr.send(formData);
  });
}

// بيوحّد الحروف المتقاربة وبيشيل التشكيل والعلامات عشان المطابقة تبقى مرنة
function normalizeArabic(str){
  return (str||'')
    .toString()
    .replace(/[\u064B-\u065F\u0670]/g,'')       // تشكيل
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/[^\u0621-\u064A0-9a-zA-Z\s]/g,' ') // شيل علامات الترقيم
    .toLowerCase()
    .trim();
}

const AR_STOPWORDS = new Set(['في','من','عن','ان','إن','هل','ما','هو','هي','و','او','أو','ايه','إيه','دي','ده','يعني','لو','مع','علي','على','كام','فين','ازاي','إزاي']);

function tokenize(str){
  return normalizeArabic(str).split(/\s+/).filter(w=> w.length>1 && !AR_STOPWORDS.has(w));
}

// بيدور على أقرب سؤال شائع مطابق ويرجع نسبة تطابق (0 لـ 1)
function findFaqAnswer(question){
  const qTokens = new Set(tokenize(question));
  if(qTokens.size===0) return null;
  let best = null, bestScore = 0;
  faqsCache.forEach(f=>{
    const bank = new Set([...tokenize(f.question), ...tokenize(f.keywords||'')]);
    if(bank.size===0) return;
    let overlap = 0;
    qTokens.forEach(t=>{ if(bank.has(t)) overlap++; });
    const score = overlap / Math.max(qTokens.size, 2);
    if(score > bestScore){ bestScore = score; best = f; }
  });
  return (best && bestScore >= 0.45) ? best : null;
}

  document.getElementById('supportOverlay').classList.add('hidden');

function renderSupportChat(){
  const body = document.getElementById('supportBody');
  if(!body) return;
  body.innerHTML = supportChatHistory.map(m=>
    `<div class="support-msg ${m.from==='me'?'me':'bot'}">${escapeHtml(m.text)}</div>`
  ).join('');
  body.scrollTop = body.scrollHeight;
}

async function sendSupportMessage(){
  const input = document.getElementById('supportInput');
  const question = (input.value||'').trim();
  if(!question) return;
  input.value = '';
  supportChatHistory.push({from:'me', text:question});
  renderSupportChat();

  const match = findFaqAnswer(question);
  setTimeout(async ()=>{
    if(match){
      supportChatHistory.push({from:'bot', text: match.answer});
    } else {
      supportChatHistory.push({from:'bot', text:'شكرًا لسؤالك 🙏 مقدرناش نلاقي رد جاهز عليه دلوقتي، هيتم مراجعته والرد عليك خلال 24 ساعة.'});
      try{
        await db.collection('supportQuestions').add({
          question,
          uid: currentUser ? currentUser.uid : null,
          name: (currentUserData && currentUserData.name) || 'زائر',
          phone: (currentUserData && currentUserData.phone) || '',
          answered:false, createdAt: Date.now()
        });
      }catch(e){ /* لو فشل الحفظ، على الأقل الرسالة اتقالت للمستخدم */ }
    }
    renderSupportChat();
  }, 400);
}

auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(user){
    try{
      const userRef = db.collection('users').doc(user.uid);
      let doc;
      try{
        // أونلاين: جرب السيرفر عادي. أوفلاين: روح على الكاش المحلي على طول من غير ما تستنى محاولة اتصال ممكن تعلّق
        doc = await userRef.get(navigator.onLine ? {} : {source:'cache'});
      }catch(e){
        doc = await userRef.get({source:'cache'});
      }
      if(!doc.exists){
        const isAdmin = ADMIN_EMAILS.includes(user.email);
        currentUserData = {
          name: user.email.split('@')[0], email: user.email,
          role: isAdmin ? 'admin' : 'user', createdAt: Date.now()
        };
        // ماننتظرش الكتابة (ممكن تتعلق أوفلاين لحد ما السيرفر يرد) — بتتسجل محليًا وتتزامن لما النت يرجع
        userRef.set(currentUserData).catch(e=> console.warn('تعذر حفظ مستخدم جديد:', e));
      } else {
        currentUserData = doc.data();
        if(ADMIN_EMAILS.includes(user.email) && currentUserData.role !== 'admin'){
          currentUserData.role = 'admin';
          userRef.update({role:'admin'}).catch(e=> console.warn('تعذر تحديث الدور:', e));
        }
        if(!currentUserData.referralCode){
          const backfillCode = user.uid.slice(0,6).toUpperCase();
          currentUserData.referralCode = backfillCode;
          userRef.update({referralCode: backfillCode}).catch(e=> console.warn('تعذر توليد كود الإحالة:', e));
          db.collection('referralCodes').doc(backfillCode).set({uid: user.uid, name: currentUserData.name||''}).catch(()=>{});

      document.getElementById('userBadge').classList.remove('hidden');

      document.getElementById('app').innerHTML = `<div class="card">
        تعذر تحميل بيانات حسابك${!navigator.onLine ? ' — مفيش نت والبيانات دي لسه ما اتحمّلتش للكاش المحلي على الجهاز ده. افتح التطبيق مرة وانت متصل بالنت الأول عشان تتحمّل، بعد كده هتشتغل أوفلاين عادي.' : '. حاول تاني.'}

        // خانة عامة صغيرة بس بتربط الكود بصاحبه، عشان مانفتحش قراءة بيانات كل المستخدمين وقت البحث عن كود إحالة
        db.collection('referralCodes').doc(myRefCode).set({uid: cred.user.uid, name}).catch(()=>{});
        // لو المستخدم دخل كود إحالة صحيح لشخص تاني، نسجّل طلب إحالة للأدمن يراجعه
        const enteredRefCode = document.getElementById('authReferralCode') ? document.getElementById('authReferralCode').value.trim().toUpperCase() : '';
        if(enteredRefCode && enteredRefCode !== myRefCode){
          try{
            const codeDoc = await db.collection('referralCodes').doc(enteredRefCode).get();
            if(codeDoc.exists){
              const referrerUid = codeDoc.data().uid;
              const referrerName = codeDoc.data().name || '';
              await db.collection('referrals').add({
                referrerUid, referrerName,
                referrerCode: enteredRefCode,
                newUserUid: cred.user.uid, newUserName: name, newUserPhone: phone,
                status:'pending', createdAt: Date.now()
              });
              await db.collection('users').doc(cred.user.uid).update({referredBy: referrerUid});
            }
          }catch(e){ /* لو فشل تسجيل الإحالة، ما نوقفش عملية التسجيل نفسها */ }
        }
      }
    }catch(e){ toast(translateAuthError(e), 'error'); }
  };
}

// معرّف ثابت للمدينة عشان مانضيفش نفس المدينة مرتين حتى لو ناس مختلفة ضافوها في نفس اللحظة
function cityDocId(governorate, name){
  return `${governorate}_${name}`.trim().replace(/[\/\s]+/g, '_');
}

// يتأكد إن المدينة مسجّلة في النظام؛ لو مش موجودة يضيفها وتبقى ثابتة لكل المستخدمين بعد كده
async function ensureCityExists(governorate, name){
  name = name.trim();
  const existing = citiesCache.find(c=>c.governorate===governorate && c.name.trim()===name);
  if(existing) return existing.name;
  try{
    await db.collection('cities').doc(cityDocId(governorate, name)).set({governorate, name, createdAt: Date.now()});
  }catch(e){ /* على الأغلب حد تاني ضافها في نفس اللحظة - نتجاهل ونكمل بنفس الاسم */ }
  return name;
}

function translateAuthError(e){
  const map = {
    'auth/user-not-found':'المستخدم غير موجود',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/email-already-in-use':'البريد الإلكتروني مستخدم بالفعل',
    'auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)',
    'auth/invalid-email':'البريد الإلكتروني غير صحيح'
  };
  return map[e.code] || 'حدث خطأ، حاول مرة أخرى';
}

let tripParamAttempted = false; // نحاول نفتح رحلة الرابط مرة واحدة بس في الجلسة، مش في كل تحديث لايف
function resolveTripParamIfNeeded(){
  if(!tripParam || tripParamAttempted || bookingViewActive || ticketViewActive) return;
  const tid = tripParam;
  const trip = tripsCache.find(t=>t.id===tid);
  if(trip){
    tripParamAttempted = true;
    tripParam = null;
    currentTab = 'trips';
    openBooking(tid);
    return;
  }
  // مش لاقيها في الكاش دلوقتي (يمكن لسه قيد المراجعة أو اتلغت) - نتأكد من السيرفر
  // مباشرة مرة واحدة بدل ما نسيب اللينك معلّق من غير رد، أو نفاجئ المستخدم بيها بعدين لوحده
  tripParamAttempted = true;
  tripParam = null;
  db.collection('trips').doc(tid).get().then(doc=>{
    if(doc.exists && doc.data().status==='approved'){
      currentTab = 'trips';
      openBooking(tid);
    } else if(doc.exists){
      toast('الرحلة دي لسه قيد المراجعة من الإدارة ومش متاحة للحجز دلوقتي', 'error');
    } else {
      toast('اللينك ده بتاع رحلة مش موجودة، يمكن اتلغت', 'error');
    }
  }).catch(()=>{
    toast('اللينك ده بتاع رحلة مش متاحة ليك دلوقتي', 'error');
  });
}

function renderTrips(){

  if(approved.length===0){
    app.innerHTML = `<div class="empty">لا توجد رحلات متاحة حاليًا 🌤️</div>`;
    return;
  }

  const userCity = currentUserData.city;

  let visibleTrips = userCity

    {id:'all', label:'كل الرحلات'},

        <span class="price-badge">${t.price} جنيه</span>

        <span class="seats-pill">🪑 ${Math.max(seatsLeft,0)} متاح</span>
      </div>
      <div class="trip-title">📍 ${escapeHtml(t.destination)} ${t.isOverflowBus ? `<span class="badge accent">🚌 باص إضافي</span>` : ''} ${avg ? `<span class="badge muted">(${avg.count} تقييم)</span>` : ''}</div>
      <div class="trip-meta">
        <div>📅 <b>${fmtDate(t.date)}</b></div>
        <div>🚌 الباص: <b>${t.busType || t.seatsTotal} راكب</b></div>
        ${t.meetingPoint ? `<div>📍 نقطة التجمع: <b>${escapeHtml(t.meetingPoint)}</b></div>` : ''}
        ${t.meetingTime ? `<div>🕐 ساعة التجمع: <b>${escapeHtml(t.meetingTime)}</b></div>` : ''}
        ${t.departureTime ? `<div>🚦 ساعة التحرك: <b>${escapeHtml(t.departureTime)}</b></div>` : ''}

async function shareTrip(tripId){
  const t = tripsCache.find(x=>x.id===tripId);
  const url = `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}&trip=${tripId}`;
  const shareText = t ? `شوف رحلة ${t.destination} دي، احجز من هنا 👇` : 'شوف الرحلة دي، احجز من هنا 👇';
  if(navigator.share){
    try{
      await navigator.share({ title: t ? `رحلة ${t.destination}` : 'رحلة', text: shareText, url });
    }catch(e){ /* المستخدم لغى شاشة المشاركة - مفيش داعي لأي رسالة */ }
  } else {
    try{
      await navigator.clipboard.writeText(url);
      toast('تم نسخ رابط المشاركة! شاركه وهتاخد عمولتك من كل حجز', 'success');
    }catch(e){ toast('تعذر نسخ الرابط', 'error'); }
  }
}

let currentBookingTripId = null;
let selectedSeatNumbers = [];
let selectedPriceOptionIds = []; // الخيارات المؤثرة على السعر المختارة حاليًا في شاشة الحجز
let pendingPriceOptions = []; // نسخة شغالة لخيارات السعر أثناء تعديل الرحلة من الأدمن

// بيبني شكل صفوف الأتوبيس الحقيقي: صفوف مزدوجة (كرسيين يمين وكرسيين شمال) + صف فاضي عند الباب النص
// (كرسيين بس على الشمال) في الباصات الكبيرة + صف خلفي كامل من غير ممر في الآخر
function generateSeatLayout(total){
  const rows = [];
  let n = 1;
  const remaining = () => total - n + 1;
  const pairRow = () => {
    const row = [{type:'seat', n:n++}, {type:'seat', n:n++}, {type:'aisle'}, {type:'seat', n:n++}, {type:'seat', n:n++}];
    rows.push(row);
  };
  const doorRow = () => {
    const row = [{type:'seat', n:n++}, {type:'seat', n:n++}, {type:'aisle'}, {type:'blank'}, {type:'blank'}];
    rows.push(row);
  };
  const backRow = (count) => {
    const row = [];
    for(let i=0; i<count; i++) row.push({type:'seat', n:n++});
    rows.push(row);
  };

  if(total >= 40){
    for(let i=0; i<5 && remaining()>=4; i++) pairRow();
    for(let i=0; i<2 && remaining()>=2; i++) doorRow();
    while(remaining() > 6) pairRow();
    if(remaining() > 0) backRow(remaining());
  } else {
    while(remaining() >= 4) pairRow();
    if(remaining() > 0) backRow(remaining());
  }
  return rows;
}

function renderSeatMapMarkup(total, takenSeats, selected){
  const rows = generateSeatLayout(total);
  return rows.map(row=>{
    const cells = row.map(cell=>{
      if(cell.type==='aisle') return `<div class="aisle-gap"></div>`;
      if(cell.type==='blank') return `<div class="seat-blank"></div>`;
      const num = cell.n;
      const taken = takenSeats.includes(num);
      const isSelected = selected.includes(num);
      const cls = taken ? 'seat taken' : isSelected ? 'seat selected' : 'seat available';
      return `<button type="button" class="${cls}" ${taken?'disabled':''} onclick="toggleSeatSelect(${num})">${num}</button>`;
    }).join('');
    return `<div class="seat-row">${cells}</div>`;
  }).join('');
}

function refreshSeatMapUI(){
  const t = tripsCache.find(x=>x.id===currentBookingTripId);
  if(!t) return;
  const total = t.busType ? parseInt(t.busType) : t.seatsTotal;
  const taken = t.bookedSeats || [];
  const holder = document.getElementById('seatRowsHolder');
  if(holder) holder.innerHTML = renderSeatMapMarkup(total, taken, selectedSeatNumbers);
  const summary = document.getElementById('seatSummary');
  if(summary){
    const count = selectedSeatNumbers.length;
    if(count>0){
      const perSeatDelta = priceOptionsDelta(t);
      const perSeatPrice = Math.max((t.price||0) + perSeatDelta, 0);
      const rawAmount = count*perSeatPrice;
      const discountAmount = calcDiscountAmount(rawAmount);
      const finalAmount = Math.max(rawAmount - discountAmount, 0);
      const priceLine = perSeatDelta ? `<br>سعر المقعد: ${t.price} ${perSeatDelta>0?'+':''}${perSeatDelta} = <b>${perSeatPrice} جنيه</b>` : '';
      summary.innerHTML = `اخترت ${count} مقعد (${[...selectedSeatNumbers].sort((a,b)=>a-b).join('، ')})${priceLine}<br>الإجمالي: ${discountAmount>0 ? `<s style="opacity:.6;">${rawAmount}</s> ` : ''}${finalAmount} جنيه`;
    } else {
      summary.textContent = 'اختار مقعد واحد على الأقل من المخطط';
    }
  }
}

function toggleSeatSelect(num){
  const idx = selectedSeatNumbers.indexOf(num);
  if(idx>=0) selectedSeatNumbers.splice(idx,1);
  else selectedSeatNumbers.push(num);
  refreshSeatMapUI();
}

// ---------------- خيارات تؤثر على السعر (زي: ذهاب فقط / خدمة إضافية) ----------------
function initSelectedPriceOptions(trip){
  selectedPriceOptionIds = [];
  const opts = trip.priceOptions || [];
  const groupDefault = {};
  opts.forEach(o=>{
    if(!o.group) return;
    if(!(o.group in groupDefault) || o.isDefault) groupDefault[o.group] = o.id;
  });
  selectedPriceOptionIds = Object.values(groupDefault);
}

function priceOptionsDelta(trip){
  const opts = trip.priceOptions || [];
  return opts.filter(o=>selectedPriceOptionIds.includes(o.id)).reduce((s,o)=>s+(o.delta||0),0);
}

function selectedPriceOptionsDetails(trip){
  const opts = trip.priceOptions || [];
  return opts.filter(o=>selectedPriceOptionIds.includes(o.id)).map(o=>({label:o.label, delta:o.delta||0, group:o.group||null}));
}

function renderPriceOptionsMarkup(trip){
  const opts = trip.priceOptions || [];
  if(!opts.length) return '';
  const groups = {};
  const addons = [];
  opts.forEach(o=>{
    if(o.group){ (groups[o.group] = groups[o.group] || []).push(o); }
    else addons.push(o);
  });
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<div class="field"><label>${escapeHtml(g)}</label>`;
    groups[g].forEach(o=>{
      const checked = selectedPriceOptionIds.includes(o.id);
      const sign = o.delta>0 ? '+' : '';
      html += `<label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:14px; margin-bottom:6px;">
        <input type="radio" name="pgroup_${escapeHtml(g)}" ${checked?'checked':''} onchange="selectPriceOption('${g.replace(/'/g,"\\'")}','${o.id}')" style="width:auto; margin:0;">
        <span>${escapeHtml(o.label)}</span>
        ${o.delta ? `<span class="badge ${o.delta>0?'accent':'approved'}">${sign}${o.delta} جنيه</span>` : ''}
      </label>`;
    });
    html += `</div>`;
  });
  if(addons.length){
    html += `<div class="field"><label>خدمات إضافية (اختياري)</label>`;
    addons.forEach(o=>{
      const checked = selectedPriceOptionIds.includes(o.id);
      const sign = o.delta>0 ? '+' : '';
      html += `<label style="display:flex; align-items:center; gap:8px; font-weight:400; font-size:14px; margin-bottom:6px;">
        <input type="checkbox" ${checked?'checked':''} onchange="togglePriceOption('${o.id}')" style="width:auto; margin:0;">
        <span>${escapeHtml(o.label)}</span>
        ${o.delta ? `<span class="badge ${o.delta>0?'accent':'approved'}">${sign}${o.delta} جنيه</span>` : ''}
      </label>`;
    });
    html += `</div>`;
  }
  return html;
}

function selectPriceOption(group, id){
  const t = tripsCache.find(x=>x.id===currentBookingTripId);
  if(!t) return;
  const groupIds = (t.priceOptions||[]).filter(o=>o.group===group).map(o=>o.id);
  selectedPriceOptionIds = selectedPriceOptionIds.filter(x=>!groupIds.includes(x));
  selectedPriceOptionIds.push(id);
  refreshSeatMapUI();
}

function togglePriceOption(id){
  const idx = selectedPriceOptionIds.indexOf(id);
  if(idx>=0) selectedPriceOptionIds.splice(idx,1);
  else selectedPriceOptionIds.push(id);
  refreshSeatMapUI();
}

function closeBooking(){
  bookingViewActive = false;
  currentBookingTripId = null;
  selectedSeatNumbers = [];
  selectedPriceOptionIds = [];
  appliedDiscount = null;
  currentTab = 'trips';
  renderTrips();
}

function calcDiscountAmount(rawAmount){
  if(!appliedDiscount) return 0;
  const v = appliedDiscount.value||0;
  return appliedDiscount.type==='percent' ? Math.round(rawAmount * v / 100) : Math.min(v, rawAmount);
}

function applyDiscountCode(){
  const codeInput = document.getElementById('bkDiscountCode');
  const msgEl = document.getElementById('discountMsg');
  const code = (codeInput.value||'').trim().toUpperCase();
  appliedDiscount = null;
  if(!code){
    if(msgEl){ msgEl.textContent = ''; }
    refreshSeatMapUI();
    return;
  }
  const dc = discountCodesCache.find(d => (d.code||'').toUpperCase() === code);
  if(!dc || !dc.active){
    if(msgEl){ msgEl.textContent = 'كود الخصم غير صحيح أو غير مفعّل'; msgEl.style.color = 'var(--danger)'; }
    refreshSeatMapUI();
    return;
  }
  if(dc.usageLimit != null && (dc.usedCount||0) >= dc.usageLimit){
    if(msgEl){ msgEl.textContent = 'انتهى عدد مرات استخدام هذا الكود'; msgEl.style.color = 'var(--danger)'; }
    refreshSeatMapUI();
    return;
  }
  if(dc.tripId && dc.tripId !== currentBookingTripId){
    if(msgEl){ msgEl.textContent = 'الكود ده خاص برحلة تانية ومش شغال على الرحلة دي'; msgEl.style.color = 'var(--danger)'; }
    refreshSeatMapUI();
    return;
  }
  appliedDiscount = dc;
  if(msgEl){
    msgEl.textContent = `✅ تم تطبيق الكود: خصم ${dc.type==='percent' ? dc.value+'%' : dc.value+' جنيه'}`;
    msgEl.style.color = 'var(--success)';
  }
  refreshSeatMapUI();
}

async function submitBooking(tripId){
  const name = document.getElementById('bkName').value.trim();
  const phone = document.getElementById('bkPhone').value.trim();
  if(!name || !phone){ toast('من فضلك املأ الاسم والموبايل', 'error'); return; }
  if(!PHONE_RE.test(phone)){ toast('رقم الموبايل غير صحيح (لازم يبدأ بـ 01 و11 رقم)', 'error'); return; }
  if(selectedSeatNumbers.length < 1){ toast('اختار مقعد واحد على الأقل من المخطط', 'error'); return; }
  const seatNumbers = [...selectedSeatNumbers].sort((a,b)=>a-b);
  const chosenPriceOptionIds = [...selectedPriceOptionIds];

  const submitBtn = document.querySelector('#app .btn.block');
  if(submitBtn) submitBtn.disabled = true;

  const tripRef = db.collection('trips').doc(tripId);
  const bookingRef = db.collection('bookings').doc();
  try{
    await db.runTransaction(async (tx)=>{
      const tripDoc = await tx.get(tripRef);
      if(!tripDoc.exists) throw new Error('trip-not-found');
      const data = tripDoc.data();
      if(data.status !== 'approved') throw new Error('trip-not-available');
      const takenSeats = data.bookedSeats || [];
      if(seatNumbers.some(n=>takenSeats.includes(n))) throw new Error('seat-taken');
      const seatsBooked = data.seatsBooked || 0;

      const chosenOptsDetails = (data.priceOptions||[]).filter(o=>chosenPriceOptionIds.includes(o.id));
      const perSeatDelta = chosenOptsDetails.reduce((s,o)=>s+(o.delta||0),0);
      const perSeatPrice = Math.max((data.price||0) + perSeatDelta, 0);
      const rawAmount = perSeatPrice * seatNumbers.length;
      let discountAmount = 0;
      let discountCodeUsed = null;
      let discountDocRef = null;
      if(appliedDiscount){
        discountDocRef = db.collection('discountCodes').doc(appliedDiscount.id);
        const discDoc = await tx.get(discountDocRef);
        if(discDoc.exists){
          const dd = discDoc.data();
          const tripOk = !dd.tripId || dd.tripId === tripId;
          if(dd.active && tripOk && (dd.usageLimit==null || (dd.usedCount||0) < dd.usageLimit)){
            discountAmount = dd.type==='percent' ? Math.round(rawAmount*(dd.value||0)/100) : Math.min(dd.value||0, rawAmount);
            discountCodeUsed = dd.code;
          } else {
            discountDocRef = null;
          }
        } else {
          discountDocRef = null;
        }
      }
      const amount = Math.max(rawAmount - discountAmount, 0);
      const referrerUid = (refParam && refParam !== currentUser.uid) ? refParam : (data.proposedBy || null);

      let commissionAmount = 0;
      let referrerName = null;
      let commissionRateUsed = null;
      if(referrerUid){
        const referrerDoc = await tx.get(db.collection('users').doc(referrerUid));
        const referrerData = referrerDoc.exists ? referrerDoc.data() : null;
        referrerName = referrerData ? referrerData.name : (referrerUid===data.proposedBy ? data.proposedByName : null);
        const personalRate = referrerData && referrerData.commissionRate != null ? referrerData.commissionRate : null;
        if(personalRate != null){
          commissionAmount = Math.round(amount * personalRate / 100);
          commissionRateUsed = personalRate;
        } else if(data.commissionType==='percent'){
          commissionAmount = Math.round(amount * (data.commissionValue||0) / 100);
          commissionRateUsed = data.commissionValue||0;
        } else if(data.commissionType==='fixed'){
          commissionAmount = (data.commissionValue||0) * seatNumbers.length;
        }
      }

      tx.update(tripRef, {
        seatsBooked: seatsBooked + seatNumbers.length,
        bookedSeats: [...takenSeats, ...seatNumbers]
      });
      if(discountDocRef && discountAmount>0){
        tx.update(discountDocRef, {usedCount: firebase.firestore.FieldValue.increment(1)});
      }
      tx.set(bookingRef, {
        tripId, tripDestination: data.destination,
        participantUid: currentUser.uid, participantName: name, participantPhone: phone,
        participantGovernorate: currentUserData.governorate||'', participantCity: currentUserData.city||'',
        participantAddress: currentUserData.address||'',
        seats: seatNumbers.length, seatNumbers,
        selectedPriceOptions: chosenOptsDetails.map(o=>({label:o.label, delta:o.delta||0})),
        priceOptionsDelta: perSeatDelta,
        originalAmount: rawAmount, discountId: discountDocRef ? discountDocRef.id : null,
        discountCode: discountCodeUsed, discountAmount, amount,
        paymentStatus:'unpaid', amountPaid:0,
        referrerUid: referrerUid || null, referrerName, commissionAmount, commissionRateUsed, commissionPaid:false,
        cancelled:false, createdAt: Date.now()
      });
    });
    toast('تم تسجيل حجزك بنجاح ✅', 'success');
    refParam = null; selectedSeatNumbers = []; selectedPriceOptionIds = []; currentBookingTripId = null; appliedDiscount = null;
    bookingViewActive = false; currentTab='trips'; renderTrips();
  }catch(e){
    if(e.message==='seat-taken'){
      toast('للأسف حد سبقك على مقعد من اللي اخترتهم، اختار مقاعد تانية', 'error');
      selectedSeatNumbers = [];
      refreshSeatMapUI();
    }
    else if(e.message==='trip-not-available') toast('الرحلة دي مبقتش متاحة', 'error');
    else toast('حدث خطأ أثناء الحجز', 'error');
    if(submitBtn) submitBtn.disabled = false;
  }
}

function updateProposeCityOptions(preselect){
  const govSel = document.getElementById('pGovernorate');
  const citySel = document.getElementById('pCity');
  if(!govSel || !citySel) return;
  const gov = govSel.value;
  const prevValue = preselect || citySel.value;
  const newCityField = document.getElementById('pNewCityField');
  if(newCityField) newCityField.classList.add('hidden');
  if(!gov){
    citySel.innerHTML = `<option value="">اختار المحافظة الأول</option>`;
    return;
  }
  const cities = citiesCache.filter(c=>c.governorate===gov).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  citySel.innerHTML = (cities.length===0 ? `<option value="">مفيش مدن مضافة لهذه المحافظة لسه</option>` : `<option value="">اختار المدينة</option>`) +
    cities.map(c=>`<option value="${escapeHtml(c.name)}" ${c.name===prevValue?'selected':''}>${escapeHtml(c.name)}</option>`).join('') +
    `<option value="__new__">➕ المدينة مش موجودة، هضيفها</option>`;
}

async function handleTripImageSelect(input){
  const file = input.files[0];
  if(!file) return;
  input.disabled = true;
  const url = await uploadImageFile(file, 'trip-images', 'pImageStatus', 'pImagePreview');
  input.disabled = false;
  if(url) pendingTripImageUrl = url;
}

async function submitProposal(){
  const destination = document.getElementById('pDest').value.trim();
  const governorate = document.getElementById('pGovernorate').value;
  const citySel = document.getElementById('pCity');
  let city = citySel.value;
  const date = document.getElementById('pDate').value;
  const price = parseFloat(document.getElementById('pPrice').value);
  const busType = document.getElementById('pBusType').value;
  const seatsTotal = parseInt(busType);
  const meetingPoint = document.getElementById('pMeetPoint').value.trim();
  const meetingTime = document.getElementById('pMeetTime').value;
  const departureTime = document.getElementById('pDepTime').value;
  const imageUrl = pendingTripImageUrl;
  const locationUrl = document.getElementById('pLocation').value.trim();
  const notes = document.getElementById('pNotes').value.trim();

  if(!destination || !date || isNaN(price) || price < 0 || !seatsTotal){
    toast('من فضلك املأ كل الحقول المطلوبة بقيم صحيحة', 'error'); return;
  }
  if(!governorate || !city){
    toast('من فضلك حدد محافظة ومدينة الرحلة عشان تظهر لأهلها', 'error'); return;
  }
  if(city === '__new__'){
    const newCity = document.getElementById('pNewCity').value.trim();
    if(!newCity){ toast('من فضلك اكتب اسم المدينة الجديدة', 'error'); return; }
    city = newCity;
  }
  try{
    await ensureCityExists(governorate, city);
    await db.collection('trips').add({
      destination, governorate, city, date, price, seatsTotal, busType, meetingPoint, meetingTime, departureTime,
      notes, imageUrl, locationUrl,
      status:'pending', proposedBy: currentUser.uid, proposedByName: currentUserData.name,
      commissionType:null, commissionValue:0, seatsBooked:0, bookedSeats:[], hidden:false, createdAt: Date.now()
    });
    toast('تم إرسال اقتراحك، في انتظار موافقة الأدمن', 'success');
    pendingTripImageUrl = '';
    currentTab='mine'; renderMine();
  }catch(e){ toast('حدث خطأ أثناء الإرسال', 'error'); }
}

function renderOrganizerRequest(){
  const app = document.getElementById('app');
  const req = myOrganizerRequest;
  if(req && req.status === 'pending'){
    app.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">طلبك قيد المراجعة ⏳</h3>
        <div class="trip-meta">بعتنا طلبك عشان تبقى مشرف رحلات، وهنراجعه ونرد عليك في أقرب وقت.</div>
      </div>`;
    return;
  }
  if(req && req.status === 'rejected'){
    app.innerHTML = `
      <div class="card">
        <h3 style="margin-top:0;">للأسف طلبك اترفض</h3>
        <div class="trip-meta" style="margin-bottom:12px;">تقدر تبعت طلب جديد ببيانات محدثة.</div>
        <button class="btn block" onclick="showOrganizerForm()">إعادة التقديم</button>
      </div>`;
    return;
  }
  showOrganizerForm();
}

      </div>
      <div class="field"><label>الرقم القومي</label><input id="orgNationalId" type="text" inputmode="numeric" maxlength="14" placeholder="14 رقم"></div>
      <button class="btn block" onclick="submitOrganizerRequest()">إرسال الطلب</button>
    </div>`;
}

async function handleIdImageSelect(input, kind){
  const file = input.files[0];
  if(!file) return;
  const ids = {
    front:{status:'idFrontStatus', preview:'idFrontPreview'},
    back:{status:'idBackStatus', preview:'idBackPreview'},
    selfie:{status:'selfieStatus', preview:'selfiePreview'}
  }[kind];
  input.disabled = true;
  const url = await uploadImageFile(file, 'id-verification', ids.status, ids.preview);
  input.disabled = false;
  if(url){
    if(kind==='front') pendingIdFrontUrl = url;
    else if(kind==='back') pendingIdBackUrl = url;
    else pendingSelfieUrl = url;
  }
}

async function submitOrganizerRequest(){
  const nationalId = document.getElementById('orgNationalId').value.trim();
  if(!pendingIdFrontUrl || !pendingIdBackUrl || !pendingSelfieUrl){
    toast('من فضلك ارفع صور وش وضهر البطاقة والسيلفي', 'error'); return;
  }
  if(!/^\d{14}$/.test(nationalId)){
    toast('من فضلك أدخل رقم قومي صحيح (14 رقم)', 'error'); return;
  }
  try{
    await db.collection('organizerRequests').doc(currentUser.uid).set({
      uid: currentUser.uid, name: currentUserData.name, email: currentUserData.email,
      idFrontUrl: pendingIdFrontUrl, idBackUrl: pendingIdBackUrl, selfieUrl: pendingSelfieUrl,
      nationalId, status:'pending', submittedAt: Date.now()
    });
    toast('تم إرسال طلبك، هنراجعه قريب', 'success');
    pendingIdFrontUrl=''; pendingIdBackUrl=''; pendingSelfieUrl='';
    currentTab='trips'; renderTrips();
  }catch(e){ toast('حدث خطأ أثناء الإرسال', 'error'); }
}

async function approveOrganizer(uid){
  if(!confirm('تأكيد الموافقة وتحويله لمشرف رحلات؟')) return;
  try{
    await db.collection('users').doc(uid).update({role:'organizer'});
    await db.collection('organizerRequests').doc(uid).update({status:'approved', reviewedAt: Date.now()});
    toast('تم قبول الطلب', 'success');
  }catch(e){ toast('حدث خطأ أثناء الموافقة', 'error'); }
}

async function rejectOrganizer(uid){
  if(!confirm('تأكيد رفض الطلب؟')) return;
  try{
    await db.collection('organizerRequests').doc(uid).update({status:'rejected', reviewedAt: Date.now()});
    toast('تم رفض الطلب', 'success');
  }catch(e){ toast('حدث خطأ أثناء الرفض', 'error'); }
}

function fmtLastContact(ts){
  if(!ts) return 'لسه ما تواصلتش';
  const diffDays = Math.floor((Date.now()-ts)/(1000*60*60*24));
  if(diffDays<=0) return 'النهاردة';
  if(diffDays===1) return 'من يوم';
  if(diffDays<7) return `من ${diffDays} أيام`;
  return fmtDate(ts);
}

// ---------------- حملات مجدولة (تسويق) ----------------
function scheduleCampaign(){
  const name = document.getElementById('campaignName').value.trim();
  const dateVal = document.getElementById('campaignDate').value;
  const timeVal = document.getElementById('campaignTime').value;
  const selected = Array.from(selectedContactIds);
  const templates = [1,2,3,4,5]
    .map(i=>document.getElementById(`bulkMsgText${i}`).value.trim())
    .filter(t=>t.length>0);
  const tripSelect = document.getElementById('contactsTripSelect');
  const tripId = tripSelect ? tripSelect.value : '';

  if(!name){ toast('اكتب اسم للحملة عشان تعرفها بعدين', 'error'); return; }
  if(selected.length===0){ toast('حدد جهة اتصال واحدة على الأقل تحت (تيك الاختيار)', 'error'); return; }
  if(templates.length===0){ toast('اكتب رسالة واحدة على الأقل', 'error'); return; }
  if(!dateVal || !timeVal){ toast('اختار تاريخ وساعة الحملة', 'error'); return; }
  const scheduledAt = new Date(`${dateVal}T${timeVal}`).getTime();
  if(isNaN(scheduledAt)){ toast('التاريخ أو الساعة غير صحيحة', 'error'); return; }
  if(scheduledAt < Date.now() - 60000){ toast('اختار معاد في المستقبل', 'error'); return; }

  db.collection('campaigns').add({
    ownerUid: currentUser.uid,
    name, tripId: tripId || null,
    contactIds: selected,
    templates,
    scheduledAt,
    status: 'scheduled',
    sentCount: 0,
    totalCount: selected.length,
    createdAt: Date.now()
  }).then(()=>{
    toast('تم جدولة الحملة ✅ هنفكّرك هنا وقت المعاد', 'success');
    document.getElementById('campaignName').value = '';
    document.getElementById('campaignDate').value = '';
    document.getElementById('campaignTime').value = '';
  }).catch(()=> toast('تعذر جدولة الحملة', 'error'));
}

function fmtCampaignTime(ts){
  try{ return new Date(ts).toLocaleString('ar-EG', {dateStyle:'medium', timeStyle:'short'}); }
  catch(e){ return ''; }
}

function campaignStatusLabel(c){
  if(c.status==='scheduled') return c.scheduledAt<=Date.now() ? '🟠 موعدها حان' : '🕓 مجدولة';
  if(c.status==='in_progress') return '📤 جاري الإرسال';
  if(c.status==='completed') return '✅ اتبعتت';
  if(c.status==='cancelled') return '🚫 ملغاة';
  return c.status;
}

function startCampaignSend(campaignId){

  const validContactIds = c.contactIds.filter(id=>contactsCache.some(x=>x.id===id && !x.deletedByOwner));
  if(validContactIds.length===0){
    toast('كل جهات الاتصال في الحملة دي اتمسحت، مش هينفع تتبعت', 'error');
    return;
  }
  const bar = document.getElementById('campaignDueBar');
  if(bar) bar.remove();
  db.collection('campaigns').doc(campaignId).update({status:'in_progress'}).catch(()=>{});
  activeCampaignId = campaignId;
  bulkSendShareUrl = c.tripId
    ? `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}&trip=${c.tripId}`

}

function renderContactsList(){
  const holder = document.getElementById('contactsListHolder');
  if(!holder) return;
  let visibleContacts = contactsCache.filter(c=>!c.deletedByOwner);
  if(visibleContacts.length===0){
    holder.innerHTML = `<div class="empty">لسه معملتش استيراد لأي جهة اتصال</div>`;
    updateBulkSelectedCount();
    return;
  }
  if(contactsSortMode==='az' || contactsSortMode==='za'){
    visibleContacts = [...visibleContacts].sort((a,b)=>{
      const cmp = (a.name||'').localeCompare(b.name||'', 'ar');
      return contactsSortMode==='az' ? cmp : -cmp;
    });
  }
  const tripSelect = document.getElementById('contactsTripSelect');
  const tripId = tripSelect ? tripSelect.value : '';

  const pageSize = contactsPageSize; // Infinity يعني "الكل"
  const totalPages = pageSize===Infinity ? 1 : Math.max(1, Math.ceil(visibleContacts.length/pageSize));
  if(contactsPage>totalPages) contactsPage = totalPages;
  const startIdx = pageSize===Infinity ? 0 : (contactsPage-1)*pageSize;
  const endIdx = pageSize===Infinity ? visibleContacts.length : startIdx+pageSize;
  const pageContacts = visibleContacts.slice(startIdx, endIdx);
  const allOnPageSelected = pageContacts.length>0 && pageContacts.every(c=>selectedContactIds.has(c.id));

  const sortLabel = contactsSortMode==='az' ? '🔤 مرتب أبجديًا (أ ← ي) — اضغط للعكس'
    : contactsSortMode==='za' ? '🔤 مرتب أبجديًا (ي ← أ) — اضغط للعكس'
    : '🔤 ترتيب أبجدي';
  let html = `
    <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:8px; margin:0;">
        <input type="checkbox" id="selectAllContacts" ${allOnPageSelected?'checked':''} onchange="toggleSelectAllContacts()" style="width:18px; height:18px;">
        تحديد الكل (في الصفحة دي)
      </label>
      <button class="btn secondary" style="flex:0 0 auto; padding:8px 12px; font-size:13px;" onclick="toggleContactsSort()">${sortLabel}</button>
    </div>`;

  html += pageContacts.map(c=>`
    <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <input type="checkbox" class="contactPickCheck" value="${c.id}" ${selectedContactIds.has(c.id)?'checked':''} onchange="onContactCheckChange(this)" style="width:18px; height:18px; flex:0 0 auto;">
      <div style="flex:1; min-width:0;">
        <div class="trip-title" style="font-size:14px;">${escapeHtml(c.name)}</div>
        <div class="trip-meta" style="margin:0;">${escapeHtml(c.phone)}</div>
        <div class="trip-meta" style="margin:0; font-size:11px;">آخر تواصل: ${fmtLastContact(c.lastContactedAt)}</div>
      </div>
      <button class="btn accent" style="flex:0 0 auto;" onclick="sendContactWhatsApp('${c.id}','${tripId}')">📩 واتساب</button>
      <button class="btn danger" style="flex:0 0 auto; padding:10px 12px;" onclick="deleteContact('${c.id}')">🗑️</button>
    </div>`).join('');

  if(totalPages>1){
    let pageBtns = '';
    for(let p=1;p<=totalPages;p++){
      pageBtns += `<button class="btn ${p===contactsPage?'accent':'secondary'}" style="min-width:38px; padding:8px 10px;" onclick="goToContactsPage(${p})">${p}</button>`;
    }
    html += `<div class="card" style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">${pageBtns}</div>`;
  }

  html += `
    <div class="card">
      <label>عدد جهات الاتصال في الصفحة</label>
      <input type="number" id="contactsPageSizeInput" min="1" step="1" value="${contactsPageSize===Infinity ? '' : contactsPageSize}" placeholder="اكتب أي رقم" onchange="onContactsPageSizeInput()" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--border);">
      <button class="btn secondary block" style="margin-top:8px;" onclick="setContactsPageSizeAll()">عرض الكل في صفحة واحدة</button>
    </div>`;

  holder.innerHTML = html;
  updateBulkSelectedCount();
}

async function importContacts(){
  try{
    const props = ['name','tel'];
    const opts = {multiple:true};
    const picked = await navigator.contacts.select(props, opts);
    if(!picked || picked.length===0) return;
    let added = 0;
    for(const c of picked){
      const name = (c.name && c.name[0]) || 'بدون اسم';
      const rawPhone = (c.tel && c.tel[0]) || '';
      const phone = rawPhone.replace(/\D/g,'').replace(/^20/,'0');
      if(!phone) continue;
      await db.collection('contacts').add({ ownerUid: currentUser.uid, name, phone, deletedByOwner:false, createdAt: Date.now() });
      added++;
    }
    toast(added>0 ? `تم استيراد ${added} من جهات الاتصال` : 'محصلش استيراد', added>0?'success':'error');
  }catch(e){
    // المستخدم لغى الاختيار أو المتصفح رفض - مفيش داعي لإزعاجه برسالة خطأ
  }
}

// ---------------- استيراد جهات اتصال من إكسل (أدمن فقط) ----------------
const CONTACTS_COL_NAME = 'الاسم';
const CONTACTS_COL_PHONE = 'رقم الموبايل';

function exportContactsTemplate(){
  try{
    const wb = XLSX.utils.book_new();
    const sample = [
      {[CONTACTS_COL_NAME]: 'أحمد محمد', [CONTACTS_COL_PHONE]: '01012345678'},
      {[CONTACTS_COL_NAME]: 'سارة علي', [CONTACTS_COL_PHONE]: '01123456789'}
    ];
    const ws = XLSX.utils.json_to_sheet(sample);
    XLSX.utils.book_append_sheet(wb, ws, 'جهات الاتصال');
    XLSX.writeFile(wb, 'قالب_جهات_الاتصال.xlsx');
  }catch(e){ toast('تعذر إنشاء ملف القالب', 'error'); }
}

function handleContactsImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      await importContactRows(rows);
    }catch(err){
      toast('تعذر قراءة الملف، تأكد إنه بنفس شكل القالب اللي اتنزّل', 'error');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

async function importContactRows(rows){
  if(!rows.length){ toast('الملف فاضي، مفيش جهات اتصال تتضاف', 'error'); return; }
  const cleanPhone = (p)=>String(p||'').replace(/\D/g,'').replace(/^20/,'0');
  const existingPhones = new Set(contactsCache.filter(c=>!c.deletedByOwner).map(c=>cleanPhone(c.phone)));
  const seenInFile = new Set();
  const toAdd = [];
  let skipped = 0;

  rows.forEach(row=>{
    const name = String(row[CONTACTS_COL_NAME]||'').trim();
    const phone = cleanPhone(row[CONTACTS_COL_PHONE]);
    if(!name || !PHONE_RE.test(phone)){ skipped++; return; }
    if(existingPhones.has(phone) || seenInFile.has(phone)){ skipped++; return; }
    seenInFile.add(phone);
    toAdd.push({name, phone});
  });

  if(toAdd.length===0){ toast(`مفيش جهات اتصال جديدة تتضاف (اتخطى ${skipped} صف مكرر أو غير صالح)`, 'error'); return; }

  try{
    // تقسيم لدفعات (Batch) عشان حد الـ 500 عملية لكل Batch في Firestore
    const CHUNK = 400;
    for(let i=0;i<toAdd.length;i+=CHUNK){
      const batch = db.batch();
      toAdd.slice(i,i+CHUNK).forEach(c=>{
        const ref = db.collection('contacts').doc();
        batch.set(ref, {ownerUid: currentUser.uid, name: c.name, phone: c.phone, deletedByOwner:false, createdAt: Date.now()});
      });
      await batch.commit();
    }
    toast(`تم إضافة ${toAdd.length} جهة اتصال${skipped ? ` (اتخطى ${skipped} مكرر أو غير صالح)` : ''} ✅`, 'success');
  }catch(e){
    toast('حدث خطأ أثناء رفع الملف', 'error');
  }
}

function sendContactWhatsApp(contactId, tripId){
  const c = contactsCache.find(x=>x.id===contactId);
  if(!c) return;
  let message;
  if(tripId){
    const t = tripsCache.find(x=>x.id===tripId);
    const shareUrl = `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}&trip=${tripId}`;
    message = t ? `اهلاً ${c.name}! شوف رحلة ${t.destination} دي، احجز من هنا: ${shareUrl}` : shareUrl;

}

// ---------------- إرسال جماعي متتابع لجهات الاتصال ----------------
let bulkSendQueue = [];
let bulkSendIndex = 0;
let bulkSendShareUrl = '';
let bulkSendTemplates = [];

function startBulkSend(){
  const selected = Array.from(selectedContactIds);
  if(selected.length===0){ toast('اختار جهة اتصال واحدة على الأقل', 'error'); return; }
  const templates = [1,2,3,4,5]
    .map(i=>document.getElementById(`bulkMsgText${i}`).value.trim())
    .filter(t=>t.length>0);
  if(templates.length===0){ toast('اكتب رسالة واحدة على الأقل', 'error'); return; }

  const tripSelect = document.getElementById('contactsTripSelect');
  const tripId = tripSelect ? tripSelect.value : '';
  if(tripId){
    bulkSendShareUrl = `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}&trip=${tripId}`;
  } else {
    bulkSendShareUrl = `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}`;
  }

  bulkSendQueue = selected;
  bulkSendIndex = 0;
  bulkSendTemplates = templates;
  sendCurrentBulkContact();
}

function sendCurrentBulkContact(){
  if(bulkSendIndex >= bulkSendQueue.length){ finishBulkSend(); return; }
  const c = contactsCache.find(x=>x.id===bulkSendQueue[bulkSendIndex]);
  if(!c){ bulkSendIndex++; sendCurrentBulkContact(); return; }
  const template = bulkSendTemplates[bulkSendIndex % bulkSendTemplates.length];
  const message = template
    .replaceAll('{الاسم}', c.name||'')
    .replaceAll('{الرابط}', bulkSendShareUrl);
  openWhatsAppLink(buildWhatsAppLink(c.phone, message));
  markContactContacted(c.id);
  renderBulkSendProgress();
}

function nextBulkContact(){
  bulkSendIndex++;
  sendCurrentBulkContact();
}

function finishBulkSend(){
  const finishedCampaignId = activeCampaignId;
  const sentCount = bulkSendQueue.length;
  bulkSendQueue = [];
  bulkSendIndex = 0;
  selectedContactIds.clear();
  activeCampaignId = null;
  const bar = document.getElementById('bulkSendProgressBar');
  if(bar) bar.remove();
  if(finishedCampaignId){
    dismissedCampaignAlerts.add(finishedCampaignId);
    db.collection('campaigns').doc(finishedCampaignId).update({status:'completed', sentCount}).catch(()=>{});
  }
  if(document.getElementById('contactsListHolder')) renderContactsList();
  toast('تم الانتهاء من الإرسال الجماعي ✅', 'success');
}

function cancelBulkSend(){
  if(activeCampaignId){
    const cid = activeCampaignId;
    db.collection('campaigns').doc(cid).update({status:'scheduled', sentCount: bulkSendIndex}).catch(()=>{});
    activeCampaignId = null;
  }
  bulkSendQueue = [];
  bulkSendIndex = 0;
  selectedContactIds.clear();
  const bar = document.getElementById('bulkSendProgressBar');
  if(bar) bar.remove();
  if(document.getElementById('contactsListHolder')) renderContactsList();
  toast('تم إيقاف الإرسال', '');
}

function renderBulkSendProgress(){
  let bar = document.getElementById('bulkSendProgressBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'bulkSendProgressBar';
    bar.style.cssText = 'position:fixed; bottom:74px; left:0; right:0; z-index:60; background:var(--primary-dark); color:#fff; padding:12px 16px; box-shadow:0 -2px 10px rgba(0,0,0,.2);';
    document.body.appendChild(bar);
  }
  const total = bulkSendQueue.length;
  const current = Math.min(bulkSendIndex+1, total);
  const c = contactsCache.find(x=>x.id===bulkSendQueue[bulkSendIndex]);
  bar.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:640px; margin:0 auto;">
      <div style="flex:1; min-width:0;">
        <div style="font-weight:800; font-size:13px;">جاري الإرسال: ${current} من ${total}</div>
        <div style="font-size:12px; opacity:.85;">${c ? escapeHtml(c.name) : ''} — بعد ما تدوس "إرسال" في واتساب، ارجع هنا ودوس التالي</div>
      </div>
      <button class="btn" style="flex:0 0 auto; background:#fff; color:var(--primary-dark); padding:8px 14px;" onclick="nextBulkContact()">التالي ⬅️</button>
      <button class="btn danger" style="flex:0 0 auto; padding:8px 12px;" onclick="cancelBulkSend()">إيقاف</button>
    </div>`;
}

// ملحوظة: إلغاء الحجز بقى خاص بالأدمن فقط (adminCancelBooking تحت) —
// اتشالت خاصية إلغاء المستخدم لحجزه بنفسه.

async function adminCancelBooking(bookingId){
  const b = bookingsCache.find(x=>x.id===bookingId);
  if(!b) return;
  if(b.cancelled){ toast('الحجز ده ملغي بالفعل', 'error'); return; }
  if(!confirm(`متأكد من إلغاء حجز ${b.participantName}؟ المقاعد هترجع متاحة للحجز تاني.`)) return;
  const bookingRef = db.collection('bookings').doc(bookingId);
  try{
    await db.runTransaction(async (tx)=>{
      const bDoc = await tx.get(bookingRef);
      if(!bDoc.exists) throw new Error('not-found');
      const bd = bDoc.data();
      if(bd.cancelled) throw new Error('already-cancelled');
      const tripRef = db.collection('trips').doc(bd.tripId);
      const tDoc = await tx.get(tripRef);
      if(tDoc.exists){
        const tData = tDoc.data();
        const bookedSeatsOfThis = bd.seatNumbers || [];
        const newBookedSeats = (tData.bookedSeats||[]).filter(n=>!bookedSeatsOfThis.includes(n));
        tx.update(tripRef, {
          seatsBooked: Math.max((tData.seatsBooked||0) - bd.seats, 0),
          bookedSeats: newBookedSeats
        });
      }
      tx.update(bookingRef, {cancelled:true});
    });
    toast('تم إلغاء الحجز', 'success');
  }catch(e){
    toast('تعذر إلغاء الحجز', 'error');
  }
}

// ---------------- TAB: الأدمن ----------------
function setAdminSubTab(tab){
  adminSubTab = tab;
  if(tab==='referrers' || tab==='users') loadAllUsersForAdmin();
  else if(tab==='usercontacts') loadAllContactsForAdmin();
  else if(tab==='faqs') loadSupportQuestionsForAdmin();
  else renderAdmin();
}

function loadSupportQuestionsForAdmin(){
  renderAdmin();
  if(unsubSupportQuestions){ renderAdmin(); return; }
  unsubSupportQuestions = db.collection('supportQuestions').orderBy('createdAt','desc').onSnapshot(snap=>{
    supportQuestionsCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(adminSubTab==='faqs') renderAdmin();
  }, ()=>{});
}

async function addFaq(){
  const qEl = document.getElementById('newFaqQuestion');
  const aEl = document.getElementById('newFaqAnswer');
  const kEl = document.getElementById('newFaqKeywords');
  const question = qEl.value.trim();
  const answer = aEl.value.trim();
  const keywords = kEl.value.trim();
  if(!question || !answer){ toast('لازم تكتب السؤال والإجابة', 'error'); return; }
  try{
    await db.collection('faqs').add({question, answer, keywords, createdAt: Date.now()});
    qEl.value=''; aEl.value=''; kEl.value='';
    toast('تمت إضافة السؤال', 'success');
  }catch(e){ toast('تعذر إضافة السؤال', 'error'); }
}

async function deleteFaq(id){
  if(!confirm('متأكد من حذف السؤال ده؟')) return;
  try{ await db.collection('faqs').doc(id).delete(); toast('تم الحذف', 'success'); }
  catch(e){ toast('تعذر الحذف', 'error'); }
}

async function markSupportQuestionAnswered(id){
  try{ await db.collection('supportQuestions').doc(id).update({answered:true}); }
  catch(e){ toast('تعذر التحديث', 'error'); }
}

function prefillFaqFromQuestion(question){
  setAdminSubTab('faqs');
  setTimeout(()=>{
    const qEl = document.getElementById('newFaqQuestion');
    if(qEl){ qEl.value = question; qEl.scrollIntoView({behavior:'smooth', block:'center'}); }
  }, 200);
}

async function loadAllUsersForAdmin(){
  renderAdmin();
  try{
    const snap = await db.collection('users').get();
    allUsersCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ toast('تعذر تحميل المستخدمين', 'error'); }
  if(adminSubTab==='referrers' || adminSubTab==='users') renderAdmin();
}

async function loadAllContactsForAdmin(){
  renderAdmin();
  try{
    const needUsers = allUsersCache.length === 0;
    const [usersSnap, contactsSnap] = await Promise.all([
      needUsers ? db.collection('users').get() : Promise.resolve(null),
      db.collection('contacts').get()
    ]);
    if(usersSnap) allUsersCache = usersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    allContactsCache = contactsSnap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ toast('تعذر تحميل جهات الاتصال', 'error'); }
  if(adminSubTab==='usercontacts') renderAdmin();
}

async function exportContactsReport(){
  try{
    if(allContactsCache.length===0 || allUsersCache.length===0){
      const needUsers = allUsersCache.length === 0;
      const [usersSnap, contactsSnap] = await Promise.all([
        needUsers ? db.collection('users').get() : Promise.resolve(null),
        db.collection('contacts').get()
      ]);
      if(usersSnap) allUsersCache = usersSnap.docs.map(d=>({id:d.id, ...d.data()}));
      allContactsCache = contactsSnap.docs.map(d=>({id:d.id, ...d.data()}));
    }
    if(allContactsCache.length===0){ toast('لا توجد جهات اتصال مضافة بعد', 'error'); return; }
    const userMap = {};
    allUsersCache.forEach(u=>{ userMap[u.id] = u; });
    const rows = allContactsCache.map(c=>{
      const owner = userMap[c.ownerUid];
      return {
        'اسم جهة الاتصال': c.name||'',
        'رقم الموبايل': c.phone||'',
        'أضافها': owner ? (owner.name||'') : 'مستخدم محذوف',
        'إيميل المضيف': owner ? (owner.email||'') : '',
        'الحالة': c.deletedByOwner ? 'محذوفة من المستخدم' : 'نشطة',
        'تاريخ الإضافة': c.createdAt ? new Date(c.createdAt).toLocaleDateString('ar-EG') : ''
      };
    });
    downloadExcel(rows, 'جهات الاتصال', 'تقرير_جهات_الاتصال.xlsx');
  }catch(e){ toast('تعذر تجهيز تقرير جهات الاتصال', 'error'); }
}

async function saveReferrerRate(uid){
  const input = document.getElementById(`rate_${uid}`);
  const val = input.value.trim();
  const rate = val==='' ? null : parseFloat(val);
  if(rate!==null && (isNaN(rate) || rate<0 || rate>100)){ toast('نسبة غير صحيحة (0 لـ 100)', 'error'); return; }
  try{
    await db.collection('users').doc(uid).update({commissionRate: rate});
    const u = allUsersCache.find(x=>x.id===uid);
    if(u) u.commissionRate = rate;
    toast('تم حفظ النسبة', 'success');
  }catch(e){ toast('حدث خطأ أثناء الحفظ', 'error'); }
}

let chartMonthlyInstance = null;
let chartDestInstance = null;

function renderAdminCharts(activeBookings, trips){
  const monthlyCanvas = document.getElementById('chartMonthly');
  const destCanvas = document.getElementById('chartDestinations');
  if(!monthlyCanvas || !destCanvas || typeof Chart === 'undefined') return;

  // الإيراد الشهري لآخر 6 شهور
  const now = new Date();
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:`${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString('ar-EG',{month:'short', year:'2-digit'}), total:0});
  }
  activeBookings.forEach(b=>{
    const d = new Date(b.createdAt||0);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find(x=>x.key===key);
    if(m) m.total += (b.amountPaid||0);
  });

  // أكتر 5 وجهات حجزًا
  const destCounts = {};
  activeBookings.forEach(b=>{
    destCounts[b.tripDestination] = (destCounts[b.tripDestination]||0) + b.seats;
  });
  const topDest = Object.entries(destCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  if(chartMonthlyInstance) chartMonthlyInstance.destroy();
  chartMonthlyInstance = new Chart(monthlyCanvas, {
    type:'bar',
    data:{ labels: months.map(m=>m.label), datasets:[{ label:'الإيراد (جنيه)', data: months.map(m=>m.total), backgroundColor:'#0D6E63' }] },
    options:{ responsive:true, plugins:{legend:{display:false}} }
  });

  if(chartDestInstance) chartDestInstance.destroy();
  chartDestInstance = new Chart(destCanvas, {
    type:'bar',
    data:{ labels: topDest.map(d=>d[0]), datasets:[{ label:'عدد المقاعد المحجوزة', data: topDest.map(d=>d[1]), backgroundColor:'#DD8A3E' }] },
    options:{ responsive:true, indexAxis:'y', plugins:{legend:{display:false}} }
  });
}

async function handleLogoSelect(input){
  const file = input.files[0];
  if(!file) return;
  input.disabled = true;
  const url = await uploadImageFile(file, 'site', 'setLogoStatus', 'setLogoPreview');
  input.disabled = false;
  if(url) pendingLogoUrl = url;
}

async function handleHeroImageSelect(input){
  const file = input.files[0];
  if(!file) return;
  input.disabled = true;
  const url = await uploadImageFile(file, 'site', 'setHeroImgStatus', 'setHeroImgPreview');
  input.disabled = false;
  if(url) pendingHeroImageUrl = url;
}

function removeHeroImage(){
  pendingHeroImageUrl = '';
  renderAdmin();
}

async function saveSiteSettings(){
  const logoUrl = pendingLogoUrl !== null ? pendingLogoUrl : (siteSettings.logoUrl || '');
  const heroImageUrl = pendingHeroImageUrl !== null ? pendingHeroImageUrl : (siteSettings.heroImageUrl || '');
  const siteName = document.getElementById('setSiteName').value.trim() || 'نظام الرحلات';
  const heroTitle = document.getElementById('setHeroTitle').value.trim();
  const heroSubtitle = document.getElementById('setHeroSub').value.trim();
  const bookingMessageTemplate = document.getElementById('setBookingMsg').value.trim();
  const tripsHeroTitleEl = document.getElementById('setTripsHeroTitle');
  const tripsHeroEyebrowEl = document.getElementById('setTripsHeroEyebrow');
  const tripsHeroTitle = tripsHeroTitleEl ? tripsHeroTitleEl.value.trim() : siteSettings.tripsHeroTitle;
  const tripsHeroEyebrow = tripsHeroEyebrowEl ? tripsHeroEyebrowEl.value.trim() : siteSettings.tripsHeroEyebrow;
  const showSearchEl = document.getElementById('setShowSearchBar');
  const showTripsSearchBar = showSearchEl ? showSearchEl.checked : (siteSettings.showTripsSearchBar !== false);
  try{
    await db.collection('settings').doc('site').set({logoUrl, siteName, heroTitle, heroSubtitle, bookingMessageTemplate, heroImageUrl, tripsHeroTitle, tripsHeroEyebrow, showTripsSearchBar}, {merge:true});
    pendingLogoUrl = null;
    pendingHeroImageUrl = null;
    toast('تم حفظ الإعدادات', 'success');
  }catch(e){ toast('حدث خطأ أثناء الحفظ (تأكد إنك أدمن)', 'error'); }
}

// ---------------- الأدمن: المحافظات والمدن ----------------
async function addCity(){
  const gov = document.getElementById('newCityGov').value;
  const name = document.getElementById('newCityName').value.trim();
  if(!gov || !name){ toast('من فضلك اختار المحافظة واكتب اسم المدينة', 'error'); return; }
  const exists = citiesCache.some(c=>c.governorate===gov && c.name.trim()===name);
  if(exists){ toast('المدينة دي متضافة قبل كده لنفس المحافظة', 'error'); return; }
  try{
    await db.collection('cities').doc(cityDocId(gov, name)).set({governorate: gov, name, createdAt: Date.now()});
    toast('تم إضافة المدينة', 'success');
  }catch(e){ toast('حدث خطأ أثناء الإضافة', 'error'); }
}

async function deleteCity(cityId){
  if(!confirm('متأكد من حذف المدينة دي؟')) return;
  try{

const DISC_COL_CODE = 'الكود';
const DISC_COL_TYPE = 'النوع (نسبة/ثابت)';
const DISC_COL_VALUE = 'القيمة';
const DISC_COL_LIMIT = 'الحد الأقصى للاستخدام (اختياري)';
const DISC_COL_TRIP = 'مرتبط برحلة (اختياري - انسخ الاسم بالظبط من شيت الرحلات)';

function tripLabel(t){ return `${t.destination} - ${fmtDate(t.date)}`; }

function exportDiscountTemplate(){

    }];

function handleDiscountImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      await importDiscountRows(rows);
    }catch(err){
      toast('تعذر قراءة الملف، تأكد إنه بنفس شكل القالب اللي اتنزّل', 'error');
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

async function importDiscountRows(rows){
  if(!rows.length){ toast('الملف فاضي، مفيش أكواد تتضاف', 'error'); return; }
  const existingCodes = new Set(discountCodesCache.map(d=>(d.code||'').toUpperCase()));
  const tripLabelMap = {};
  tripsCache.forEach(t=>{ tripLabelMap[tripLabel(t)] = t.id; });

  const seenInFile = new Set();
  const toAdd = [];
  let skipped = 0;

  rows.forEach(row=>{
    const code = String(row[DISC_COL_CODE]||'').trim().toUpperCase();
    if(!code) return;
    if(existingCodes.has(code) || seenInFile.has(code)){ skipped++; return; }
    const typeRaw = String(row[DISC_COL_TYPE]||'').trim();
    const type = typeRaw==='ثابت' ? 'fixed' : 'percent';
    const value = parseFloat(row[DISC_COL_VALUE]);
    if(isNaN(value) || value<0 || (type==='percent' && value>100)){ skipped++; return; }
    const limitRaw = row[DISC_COL_LIMIT];
    const usageLimit = (limitRaw===''||limitRaw==null) ? null : parseInt(limitRaw);
    if(usageLimit!=null && isNaN(usageLimit)){ skipped++; return; }
    const tripLbl = String(row[DISC_COL_TRIP]||'').trim();
    let tripId = null;
    if(tripLbl){
      tripId = tripLabelMap[tripLbl];
      if(!tripId){ skipped++; return; } // الاسم متطابقش مع رحلة موجودة
    }
    seenInFile.add(code);
    toAdd.push({code, type, value, usageLimit, tripId});
  });

  if(toAdd.length===0){
    toast(`مفيش أكواد صالحة للإضافة${skipped ? ` (${skipped} صف اتجاهل)` : ''}`, 'error');
    return;
  }

  try{
    for(let i=0; i<toAdd.length; i+=450){
      const chunk = toAdd.slice(i, i+450);
      const batch = db.batch();
      chunk.forEach(item=>{
        const docRef = db.collection('discountCodes').doc();
        batch.set(docRef, {
          code: item.code, type: item.type, value: item.value,
          usageLimit: item.usageLimit, tripId: item.tripId,
          usedCount:0, active:true, createdAt: Date.now()
        });
      });
      await batch.commit();
    }
    toast(`تم إضافة ${toAdd.length} كود${skipped ? ` (اتجاهل ${skipped} صف غير صالح أو مكرر)` : ''}`, 'success');
  }catch(e){ toast('حدث خطأ أثناء استيراد الأكواد', 'error'); }
}
